<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"><title>Irmandade do Asfalto | Motoclube</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>
<style>/* CSS original mantido intacto */</style>
</head>
<body>
<!-- todo o HTML anterior (idêntico) até a parte do adminView, que será modificado abaixo -->
<div class="bg-cyber"></div><div class="particles" id="particlesContainer"></div><div id="toastContainer"></div>
<div id="loadingOverlay" class="loading-overlay hidden"><div class="spinner"></div><span style="color:var(--orange);">Conectando...</span></div>
<div id="authScreen"><div class="auth-card"><div class="auth-skull">💀</div><div class="auth-title">IRMANDADE DO ASFALTO</div><div class="auth-subtitle">Motoclube</div><input id="emailLogin" type="email" placeholder="Seu email" autocomplete="email"><input id="senhaLogin" type="password" placeholder="Sua senha" autocomplete="current-password"><button class="btn btn-primary" id="loginBtn">⚡ ENTRAR</button><button class="btn btn-outline" id="registerBtn">🛡️ CRIAR CONTA</button><button class="btn btn-outline" id="forgotPasswordBtn" style="font-size:14px;">🔑 Recuperar senha</button></div></div>
<div id="app" class="hidden">
<main>
    <div class="view active" id="homeView">...</div>
    <div class="view" id="missoesView">...</div>
    <div class="view" id="lojaView">...</div>
    <div class="view" id="inventarioView">...</div>
    <div class="view" id="guildasView">...</div>
    <div class="view" id="eventosView">...</div>
    <div class="view" id="sorteiosView">...</div>
    <div class="view" id="rankingView">...</div>
    <div class="view" id="perfilView">...</div>
    <div class="view" id="atendimentoView">...</div>
    <div class="view" id="adminView">
      <div class="card">
        <div class="section-title">👑 Painel do Mestre</div>
        <h4>👥 Membros</h4><div id="membersList"></div><hr>
        <h4>🪙 Cunhar Recompensa</h4>
        <input id="rewardEmail" placeholder="Email"><input id="rewardTokens" type="number" placeholder="Tokens"><input id="rewardXp" type="number" placeholder="XP"><button class="btn btn-primary" id="rewardBtn">🔥 ENVIAR</button><hr>
        <h4>🛒 Criar Item</h4>
        <input id="itemName" placeholder="Nome"><input id="itemPrice" type="number" placeholder="Preço"><button class="btn btn-primary" id="createItemBtn">CRIAR</button><hr>
        <h4>⚔️ Criar Missão</h4>
        <input id="missionTitle" placeholder="Título"><input id="missionDesc" placeholder="Descrição"><input id="missionXp" type="number" placeholder="XP"><input id="missionTokens" type="number" placeholder="Tokens"><button class="btn btn-primary" id="createMissionBtn">CRIAR</button>
        <div id="adminMissionsList" style="margin-top:16px"></div><hr>
        <h4>🤝 Criar Parceiro</h4>
        <input id="partnerName" placeholder="Nome"><input id="partnerDiscount" placeholder="Desconto"><input id="partnerCashback" type="number" placeholder="Cashback %"><textarea id="partnerDesc" placeholder="Descrição"></textarea><button class="btn btn-primary" id="createPartnerBtn">CRIAR</button>
        <div id="adminPartnersList" style="margin-top:16px"></div><hr>
        <!-- NOVO: Criar Evento com QR Checkpoint -->
        <h4>📅 Criar Evento</h4>
        <input id="eventTitle" placeholder="Título do evento">
        <input id="eventDate" type="date" placeholder="Data">
        <input id="eventTime" type="time" placeholder="Hora">
        <textarea id="eventSubject" placeholder="Assunto / Descrição do evento"></textarea>
        <input id="eventXpReward" type="number" placeholder="XP ao participar" value="50">
        <input id="eventTokensReward" type="number" placeholder="Tokens ao participar (opcional)" value="10">
        <button class="btn btn-primary" id="createEventBtn">📅 CRIAR EVENTO E GERAR QR CHECKPOINT</button>
        <div id="adminEventsList" style="margin-top:16px"></div><hr>
        <!-- NOVO: Criar Ticket (Ingresso para Sorteio) -->
        <h4>🎟️ Criar Ticket (Ingresso para Sorteio)</h4>
        <input id="ticketName" placeholder="Nome do ingresso (ex: Ingresso para Sorteio Anual)">
        <input id="ticketPrice" type="number" placeholder="Preço em tokens">
        <select id="ticketRaffleSelect"><option value="">Selecione o sorteio...</option></select>
        <button class="btn btn-primary" id="createTicketBtn">🎟️ CRIAR INGRESSO</button><hr>
        <h4>🎟️ Sorteios Existentes</h4>
        <div id="adminRafflesList" style="margin-top:16px"></div><hr>
        <h4>⛔ Banir / Liberar</h4>
        <input id="targetEmail" placeholder="Email do usuário"><button class="btn-danger" id="banUserBtn">BANIR</button><button class="btn-outline" id="unbanUserBtn">LIBERAR</button>
      </div>
    </div>
</main>
<nav>...</nav>
</div>
<!-- modais iguais -->
<script>
(function(){
    // ========== PROTEÇÃO ANTI-DEVTOOLS ==========
    document.addEventListener('contextmenu', e => e.preventDefault());
    document.addEventListener('keydown', e => { if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I','J','C'].includes(e.key)) || (e.ctrlKey && e.key === 'U') || (e.ctrlKey && e.key === 'S')) { e.preventDefault(); return false; } });
    let dvo=!1,el=new Image();Object.defineProperty(el,'id',{get:function(){dvo=!0;document.body.innerHTML='<div style="position:fixed;inset:0;background:#000;color:red;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:99999;font-size:24px;text-align:center"><h1>🔒 ACESSO BLOQUEADO</h1><p>Ferramentas de desenvolvedor detectadas.<br>Recarregue a página sem o DevTools.</p></div>';document.body.style.overflow='hidden';throw new Error('DevTools detectado');}});
    setInterval(()=>{dvo=!1;console.log(el);console.clear();if(dvo){document.body.innerHTML='<div style="position:fixed;inset:0;background:#000;color:red;display:flex;align-items:center;justify-content:center;flex-direction:column;z-index:99999;font-size:24px;text-align:center"><h1>🔒 ACESSO BLOQUEADO</h1><p>Ferramentas de desenvolvedor detectadas.<br>Recarregue a página sem o DevTools.</p></div>';document.body.style.overflow='hidden';}},1e3);
    // ========== FIREBASE ==========
    firebase.initializeApp({ apiKey: "AIzaSyDbb96DSw05nFxK8W6-khfbkRMn9CIheq8", authDomain: "clube-de-vantagens-d748e.firebaseapp.com", projectId: "clube-de-vantagens-d748e", storageBucket: "clube-de-vantagens-d748e.appspot.com", messagingSenderId: "774730191238", appId: "1:774730191238:web:9af24eddfafb18f1351c07" });
    const a=firebase.auth(),b=firebase.firestore(),inc=firebase.firestore.FieldValue.increment,arrU=firebase.firestore.FieldValue.arrayUnion,rem=firebase.firestore.FieldValue.arrayRemove,ts=firebase.firestore.FieldValue.serverTimestamp,MASTER="cristophersmonteiro357@gmail.com";
    let cu=null,usub=null,cfg={xpStore:5,xpReceipt:3,xpTicket:0,xpRaffle:2,defCash:5},scanStream=null,pendScan=null;
    const cd=new Map();function checkCD(a,s=5){let l=cd.get(a),n=Date.now();if(l&&(n-l)<s*1e3){toast(`Aguarde ${s}s`,'error');return!1}cd.set(a,n);return!0}
    function san(t,m=300){if(!t)return '';let c=t.replace(/[<>"']/g,'').trim();if(c.length>m)c=c.slice(0,m);return c}
    function esc(t){return t?t.replace(/[&<>]/g,m=>m==='&'?'&amp;':m==='<'?'&lt;':'&gt;'):''}
    function updXp(x){let lvl=x%100;document.getElementById('xpFill').style.width=(lvl/100*100)+'%'}
    function lvl(x){return Math.floor((x||0)/100)+1}
    function rank(x){if(x>=5e4)return{nome:'Deus do Asfalto',classe:'rank-deus'};if(x>=25000)return{nome:'Lenda Imortal',classe:'rank-imortal2'};if(x>=12000)return{nome:'Ícone da Irmandade',classe:'rank-icone'};if(x>=6e3)return{nome:'Mestre do Asfalto',classe:'rank-mestre'};if(x>=3e3)return{nome:'Lenda Urbana',classe:'rank-lenda'};if(x>=1500)return{nome:'Forjado na Estrada',classe:'rank-forjado'};if(x>=700)return{nome:'Líder de Comboio',classe:'rank-lider'};if(x>=300)return{nome:'Guardião do Asfalto',classe:'rank-guardiao'};if(x>=100)return{nome:'Estradeiro',classe:'rank-estradeiro'};return{nome:'Aspirante',classe:'rank-aspirante'}}
    const $=id=>document.getElementById(id);function ld(){document.getElementById('loadingOverlay').classList.remove('hidden')}function hd(){document.getElementById('loadingOverlay').classList.add('hidden')}
    function toast(msg,t='info'){let c=$('toastContainer'),d=document.createElement('div');d.className=`toast toast-${t}`;d.innerText=msg;c.appendChild(d);setTimeout(()=>d.remove(),3500);}
    async function loadCfg(){try{let d=await b.collection('config').doc('xp_rewards').get();if(d.exists){let dt=d.data();if(dt.xpStore!==undefined)cfg.xpStore=dt.xpStore;if(dt.xpReceipt!==undefined)cfg.xpReceipt=dt.xpReceipt;if(dt.xpTicket!==undefined)cfg.xpTicket=dt.xpTicket;if(dt.xpRaffle!==undefined)cfg.xpRaffle=dt.xpRaffle;if(dt.defaultCashback!==undefined)cfg.defCash=dt.defaultCashback;}}catch(e){}}
    async function updUI(){if(!cu)return;let x=cu.xp||0,tk=cu.tokens||0,rep=cu.reputation||0,rk=rank(x),l=lvl(x),st=cu.status||'adimplente';$('tokensAmount').innerText=tk;$('nicknameDisplay').innerText=cu.profile?.nickname||'Membro';$('xpAmount').innerText=x;$('xpText').innerText=`${x} XP`;$('reputationDisplay').innerText=rep;$('levelText').innerText=`Lv.${l}`;updXp(x);let re=$('rankBadge');re.innerText=rk.nome;re.className=`rank-badge ${rk.classe}`;let se=$('statusBadge');se.innerText=st==='adimplente'?'Adimplente':st.toUpperCase();se.className=`status-badge ${st==='adimplente'?'status-ok':'status-bad'}`;if($('nicknameInput'))$('nicknameInput').value=cu.profile?.nickname||'';if($('bikeInput'))$('bikeInput').value=cu.profile?.bike||'';if($('cityInput'))$('cityInput').value=cu.profile?.city||'';if($('instagramInput'))$('instagramInput').value=cu.profile?.instagram||'';if($('bioInput'))$('bioInput').value=cu.profile?.bio||'';let adm=cu.role==='admin';document.querySelectorAll('.admin-only').forEach(el=>el.style.display=adm?'flex':'none');}
    async function loadPrivCPF(){if(!cu)return'';let d=await b.collection('private').doc(cu.uid).get();return d.exists?d.data().cpf:'';}
    async function savePrivCPF(c){if(!cu)return;let cl=c.replace(/\D/g,'').slice(0,11);await b.collection('private').doc(cu.uid).set({cpf:cl},{merge:!0});}
    async function forceUserDoc(u){let r=b.collection('users').doc(u.uid),s=await r.get();if(s.exists)return s.data();let isM=u.email===MASTER,prof={nickname:u.email.split('@')[0],bike:'',city:'',bio:'',instagram:'',avatar:'',banner:''},pay={email:u.email,role:isM?'admin':'novato',tokens:0,xp:0,reputation:0,status:'adimplente',guildId:null,achievements:[],inventory:[],titles:[],badges:[],profile:prof,createdAt:ts(),lastLogin:ts(),ticketsOwned:[]};await r.set(pay,{merge:!0});toast(`✅ Perfil criado${isM?' (Mestre)':''}!`,'success');return pay;}
    async function ensureAdmin(u){if(u.email!==MASTER)return;let r=b.collection('users').doc(u.uid),d=await r.get();if(d.exists&&d.data().role!=='admin'){await r.update({role:'admin'});toast('🔑 Promovido a Mestre!','success');}}
    function listenU(){if(usub)usub();usub=b.collection('users').doc(cu.uid).onSnapshot(d=>{if(d.exists){let dt=d.data();if(dt.status==='banido'){toast('Conta banida','error');a.signOut();return;}let ox=cu.xp||0;cu={...cu,...dt,uid:cu.uid};updUI();if(lvl(cu.xp)>lvl(ox)){$('hero')?.classList.add('level-up-anim');setTimeout(()=>$('hero')?.classList.remove('level-up-anim'),600);toast('⬆️ LEVEL UP! ⬆️','success');}}},e=>console.error(e));}
    // ========== LOADERS (abreviados) ==========
    async function loadPartners(){let c=$('partnersList');c.innerHTML='<p class="muted">Carregando...</p>';try{let s=await b.collection('partners').orderBy('createdAt','desc').limit(20).get();if(s.empty){c.innerHTML='<p class="muted">Nenhum parceiro.</p>';return;}let h='';s.forEach(d=>{let p=d.data();h+=`<div class="partner-card"><h3>${esc(p.name||'Parceiro')}</h3><p>${esc(p.description||'')}</p><div><span class="rank-badge">${esc(p.discount||'Benefício')}</span><span class="status-badge">Cashback ${p.cashback||cfg.defCash}%</span></div></div>`;});c.innerHTML=h;}catch(e){c.innerHTML='<p class="muted">Erro.</p>';}}
    async function loadMissoes(){let c=$('missoesList');c.innerHTML='<p class="muted">Carregando...</p>';try{let s=await b.collection('missions').orderBy('createdAt','desc').limit(30).get();if(s.empty){c.innerHTML='<p class="muted">Nenhuma missão.</p>';return;}let h='';s.forEach(d=>{let m=d.data();h+=`<div class="mission-card"><h3>${esc(m.title)}</h3><p>${esc(m.description)}</p><div>+${m.xp||0} XP | +${m.tokens||0} Tokens</div></div>`;});c.innerHTML=h;}catch(e){c.innerHTML='<p class="muted">Erro.</p>';}}
    async function loadLoja(){let c=$('lojaList');c.innerHTML='<p class="muted">Carregando loja...</p>';try{let s=await b.collection('store').limit(50).get();if(s.empty){c.innerHTML='<p class="muted">Nenhum item.</p>';return;}let h='';s.forEach(d=>{let i=d.data();h+=`<div class="item-card"><h3>${esc(i.name)}</h3><p>${i.price} tokens</p>${i.type==='ingresso_sorteio'?`<p class="muted">🎟️ Ingresso para sorteio</p>`:''}<button class="btn-small" data-id="${d.id}">Comprar</button></div>`;});c.innerHTML=h;c.querySelectorAll('.btn-small').forEach(btn=>btn.addEventListener('click',()=>comprarItem(btn.dataset.id)));}catch(e){c.innerHTML='<p class="muted">Erro.</p>';}}
    async function comprarItem(itemId){if(!cu)return toast('Login necessário','error');if(!checkCD('buy',3))return;ld();try{let uR=b.collection('users').doc(cu.uid),iR=b.collection('store').doc(itemId);await b.runTransaction(async t=>{let iDoc=await t.get(iR);if(!iDoc.exists)throw new Error('Item não existe');let it=iDoc.data(),uDoc=await t.get(uR);if(uDoc.data().tokens<it.price)throw new Error('Tokens insuficientes');if(uDoc.data().inventory&&uDoc.data().inventory.includes(itemId))throw new Error('Você já possui este item!');t.update(uR,{tokens:inc(-it.price),inventory:arrU(itemId),xp:inc(cfg.xpStore)});});toast(`Comprou! +${cfg.xpStore} XP`,'success');let snap=await uR.get();cu.tokens=snap.data().tokens;cu.xp=snap.data().xp;updUI();await loadInventario();}catch(e){toast(e.message,'error');}finally{hd();}}
    async function loadInventario(){let c=$('inventarioList');if(!cu?.inventory?.length){c.innerHTML='<p class="muted">Inventário vazio.</p>';return;}ld();try{let prom=cu.inventory.map(id=>b.collection('store').doc(id).get()),docs=await Promise.all(prom),h='';docs.forEach(d=>{if(d.exists){let it=d.data();h+=`<div class="item-card"><h3>${esc(it.name)}</h3><p>${it.price} tokens</p>${it.type==='ingresso_sorteio'?`<button class="btn-small" data-item="${d.id}" data-raffle="${it.raffleId}" style="background:var(--orange);">🎟️ Usar no sorteio</button>`:''}</div>`;}});c.innerHTML=h||'<p class="muted">Nenhum item válido.</p>';c.querySelectorAll('[data-item][data-raffle]').forEach(btn=>btn.addEventListener('click',()=>usarIngressoSorteio(btn.dataset.item,btn.dataset.raffle)));}catch(e){c.innerHTML='<p class="muted">Erro.</p>';}finally{hd();}}
    async function usarIngressoSorteio(itemId,raffleId){if(!cu)return toast('Login necessário','error');if(!checkCD('use_ticket',3))return;ld();try{let uR=b.collection('users').doc(cu.uid),raffleRef=b.collection('raffles').doc(raffleId);await b.runTransaction(async t=>{let userDoc=await t.get(uR),raffleDoc=await t.get(raffleRef);if(!raffleDoc.exists)throw new Error('Sorteio não existe');if(!userDoc.data().inventory.includes(itemId))throw new Error('Você não possui este ingresso');t.update(uR,{inventory:rem(itemId)});t.update(raffleRef,{entries:arrU(cu.uid)});});toast(`🎟️ Ingresso utilizado! Você está participando do sorteio.`,'success');await loadInventario();}catch(e){toast(e.message,'error');}finally{hd();}}
    async function loadRanking(){let c=$('rankingList');c.innerHTML='<p class="muted">Carregando ranking...</p>';try{let s=await b.collection('users').orderBy('xp','desc').limit(50).get();if(s.empty){c.innerHTML='<p class="muted">Ranking indisponível.</p>';return;}let h='<ol>';s.forEach(d=>{let u=d.data();h+=`<li><strong>${esc(u.profile?.nickname||'Anônimo')}</strong> - ${u.xp||0} XP</li>`;});h+='</ol>';c.innerHTML=h;}catch(e){c.innerHTML='<p class="muted">Erro.</p>';}}
    async function loadServices(){let c=$('servicesList');c.innerHTML='<p class="muted">Carregando serviços...</p>';try{let s=await b.collection('services').limit(20).get();if(s.empty){c.innerHTML='<p class="muted">Nenhum serviço.</p>';return;}let h='',sel=$('ticketServiceSelect');sel.innerHTML='<option value="">Selecione...</option>';s.forEach(d=>{let sv=d.data();h+=`<div class="ticket-card"><h3>${esc(sv.name)}</h3><p>${esc(sv.description)}</p><p>Custo: ${sv.cost} tokens</p></div>`;sel.innerHTML+=`<option value="${d.id}">${esc(sv.name)} (${sv.cost} tokens)</option>`;});c.innerHTML=h;}catch(e){c.innerHTML='<p class="muted">Erro.</p>';}}
    async function loadMyTickets(){let c=$('myTicketsList');if(!cu){c.innerHTML='<p class="muted">Faça login.</p>';return;}c.innerHTML='<p class="muted">Carregando...</p>';try{let s=await b.collection('tickets').where('userId','==',cu.uid).orderBy('createdAt','desc').limit(20).get();if(s.empty){c.innerHTML='<p class="muted">Nenhum chamado.</p>';return;}let h='';s.forEach(d=>{let t=d.data();h+=`<div class="ticket-card"><h3>${esc(t.serviceName)}</h3><p>${esc(t.description)}</p><span class="status-badge">${t.status||'aberto'}</span></div>`;});c.innerHTML=h;}catch(e){c.innerHTML='<p class="muted">Erro.</p>';}}
    async function loadGuildas(){$('guildasList').innerHTML='<p class="muted">Em breve...</p>';}
    async function loadEventos(){$('eventosList').innerHTML='<p class="muted">Em breve...</p>';}
    async function loadSorteios(){let c=$('sorteiosList');c.innerHTML='<p class="muted">Carregando sorteios...</p>';try{let s=await b.collection('raffles').limit(20).get();if(s.empty){c.innerHTML='<p class="muted">Nenhum sorteio.</p>';return;}let h='';s.forEach(d=>{let r=d.data();h+=`<div class="raffle-card"><h3>${esc(r.title)}</h3><p>Prêmio: ${r.description||''}</p><button class="btn-small" data-id="${d.id}">🎟️ Participar (requer ingresso)</button></div>`;});c.innerHTML=h;c.querySelectorAll('.btn-small').forEach(btn=>btn.addEventListener('click',()=>{toast('Compre o ingresso na loja e use-o pelo seu inventário.','info');}));}catch(e){c.innerHTML='<p class="muted">Erro.</p>';}}
    // ========== ADMIN ==========
    async function giveReward(email,tokens,xp){if(cu?.role!=='admin')return toast('Acesso negado','error');try{let q=await b.collection('users').where('email','==',email).limit(1).get();if(q.empty)throw new Error('Usuário não encontrado');let uid=q.docs[0].id;await b.collection('users').doc(uid).update({tokens:inc(tokens),xp:inc(xp)});toast(`Recompensa enviada para ${email}`,'success');}catch(e){toast(e.message,'error');}}
    async function createItem(n,p){if(cu?.role!=='admin')return toast('Acesso negado','error');if(!n||p<=0)return toast('Dados inválidos','error');await b.collection('store').add({name:san(n),price:p,type:'normal',createdAt:ts()});toast('Item criado!','success');loadLoja();}
    async function createMission(tit,desc,xp,tk){if(cu?.role!=='admin')return toast('Acesso negado','error');await b.collection('missions').add({title:san(tit),description:san(desc),xp,tokens:tk,createdAt:ts()});toast('Missão criada!','success');loadMissoes();loadAdminMissions();}
    async function createPartner(name,disc,cash,desc){if(cu?.role!=='admin')return toast('Acesso negado','error');await b.collection('partners').add({name:san(name),discount:san(disc),cashback:cash,description:san(desc),createdAt:ts()});toast('Parceiro criado!','success');loadPartners();loadAdminPartners();}
    async function createRaffle(tit,cost,desc){if(cu?.role!=='admin')return toast('Acesso negado','error');await b.collection('raffles').add({title:san(tit),description:san(desc),entries:[],createdAt:ts()});toast('Sorteio criado!','success');loadSorteios();loadRaffleSelects();}
    async function createTicket(nome,preco,raffleId){if(cu?.role!=='admin')return toast('Acesso negado','error');if(!nome||preco<=0||!raffleId)return toast('Dados inválidos','error');await b.collection('store').add({name:san(nome),price:preco,type:'ingresso_sorteio',raffleId:raffleId,createdAt:ts()});toast('Ingresso criado!','success');loadLoja();}
    async function createEvent(title,date,time,subject,xpReward,tokensReward){if(cu?.role!=='admin')return toast('Acesso negado','error');if(!title||!date)return toast('Título e data são obrigatórios','error');let datetime=new Date(`${date}T${time||'12:00'}`);if(isNaN(datetime))datetime=new Date(date);let eventRef=await b.collection('events').add({title:san(title),date:firebase.firestore.Timestamp.fromDate(datetime),subject:san(subject),xpReward:xpReward||0,tokensReward:tokensReward||0,createdAt:ts()});let qrId=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).substring(2);let qrData={type:'event',refId:eventRef.id,xpReward:xpReward||0,tokensReward:tokensReward||0,expiresAt:firebase.firestore.Timestamp.fromDate(new Date(Date.now()+7*24*60*60*1000)),usedBy:[],usedCount:0,createdAt:ts()};await b.collection('qr_checkpoints').doc(qrId).set(qrData);let cont=$('qrCanvasContainer');cont.innerHTML='';new QRCode(cont,{text:qrId,width:300,height:300});$('qrModalTitle').innerText='QR Checkpoint do Evento';$('qrModalDescription').innerHTML=`Evento: ${title}<br>Data: ${datetime.toLocaleString()}<br>Recompensa: ${xpReward} XP / ${tokensReward} Tokens`;$('qrModal').classList.remove('hidden');toast('Evento criado e QR gerado!','success');}
    async function banUser(email,ban=!0){if(cu?.role!=='admin')return toast('Acesso negado','error');let q=await b.collection('users').where('email','==',email).limit(1).get();if(q.empty)return toast('Usuário não encontrado','error');let uid=q.docs[0].id;await b.collection('users').doc(uid).update({status:ban?'banido':'adimplente'});toast(ban?'Usuário banido':'Usuário liberado','success');}
    async function loadAdminMissions(){let c=$('adminMissionsList');if(!c)return;c.innerHTML='<p class="muted">Carregando missões...</p>';try{let s=await b.collection('missions').limit(30).get();if(s.empty){c.innerHTML='<p class="muted">Nenhuma missão.</p>';return;}let h='';s.forEach(d=>{let m=d.data();h+=`<div><strong>${esc(m.title)}</strong> (${m.xp||0} XP / ${m.tokens||0} Tokens) <button class="btn-small" data-mission="${d.id}">📷 Gerar QR</button></div>`;});c.innerHTML=h;c.querySelectorAll('[data-mission]').forEach(btn=>btn.addEventListener('click',()=>openQRModal('mission',btn.dataset.mission)));}catch(e){c.innerHTML='<p class="muted">Erro.</p>';}}
    async function loadAdminPartners(){let c=$('adminPartnersList');if(!c)return;c.innerHTML='<p class="muted">Carregando parceiros...</p>';try{let s=await b.collection('partners').limit(30).get();if(s.empty){c.innerHTML='<p class="muted">Nenhum parceiro.</p>';return;}let h='';s.forEach(d=>{let p=d.data();h+=`<div><strong>${esc(p.name)}</strong> (Cashback ${p.cashback||0}%) <button class="btn-small" data-partner="${d.id}">📷 Gerar QR</button></div>`;});c.innerHTML=h;c.querySelectorAll('[data-partner]').forEach(btn=>btn.addEventListener('click',()=>openQRModal('partner',btn.dataset.partner)));}catch(e){c.innerHTML='<p class="muted">Erro.</p>';}}
    async function loadAdminRaffles(){let c=$('adminRafflesList');if(!c)return;c.innerHTML='<p class="muted">Carregando sorteios...</p>';try{let s=await b.collection('raffles').limit(30).get();if(s.empty){c.innerHTML='<p class="muted">Nenhum sorteio.</p>';return;}let h='';s.forEach(d=>{let r=d.data();h+=`<div><strong>${esc(r.title)}</strong> - Participantes: ${r.entries?.length||0} <button class="btn-small" onclick="alert('ID: ${d.id}')">📋 ID</button></div>`;});c.innerHTML=h;}catch(e){c.innerHTML='<p class="muted">Erro.</p>';}}
    async function loadRaffleSelects(){let s=await b.collection('raffles').get();let opts='<option value="">Selecione o sorteio...</option>';s.forEach(d=>{opts+=`<option value="${d.id}">${esc(d.data().title)}</option>`;});$('ticketRaffleSelect').innerHTML=opts;}
    let curType=null,curRef=null;
    function openQRModal(t,r){if(cu?.role!=='admin')return toast('Acesso negado','error');curType=t;curRef=r;$('qrGenTitle').innerText=t==='partner'?'QR Checkpoint Parceiro':'QR Checkpoint Missão';$('generateQRModal').classList.remove('hidden');}
    function closeGenQR(){$('generateQRModal').classList.add('hidden');}
    $('confirmGenerateQRBtn')?.addEventListener('click',async()=>{let xp=parseInt($('qrRewardXp').value)||0,tk=parseInt($('qrRewardTokens').value)||0,val=parseInt($('qrExpiryValue').value)||1,unit=$('qrExpiryUnit').value,exp=new Date();if(unit==='hours')exp.setHours(exp.getHours()+val);else exp.setDate(exp.getDate()+val);let qrId=crypto.randomUUID?crypto.randomUUID():Math.random().toString(36).substring(2),qrData={type:curType,refId:curRef,xpReward:xp,tokensReward:tk,expiresAt:firebase.firestore.Timestamp.fromDate(exp),usedBy:[],usedCount:0,createdAt:ts()};ld();try{await b.collection('qr_checkpoints').doc(qrId).set(qrData);let cont=$('qrCanvasContainer');cont.innerHTML='';new QRCode(cont,{text:qrId,width:300,height:300});$('qrModalTitle').innerText=curType==='partner'?'QR Checkpoint Parceiro':'QR Checkpoint Missão';$('qrModalDescription').innerHTML=`Válido até ${exp.toLocaleString()}<br>Recompensa: ${xp} XP / ${tk} Tokens`;$('qrModal').classList.remove('hidden');closeGenQR();toast('QR Code gerado!','success');}catch(e){toast('Erro ao gerar QR: '+e.message,'error');}finally{hd();}});
    window.downloadQRCode=function(){let cv=document.querySelector('#qrCanvasContainer canvas');if(!cv){toast('Nenhum QR disponível','error');return;}let lnk=document.createElement('a');lnk.download='qrcode_checkpoint.png';lnk.href=cv.toDataURL('image/png');lnk.click();toast('Download iniciado!','success');};
    async function startScanner(type){if(!cu)return toast('Login necessário','error');pendScan=type;$('scannerModal').classList.remove('hidden');let vid=$('scannerVideo'),can=$('scannerCanvas'),ctx=can.getContext('2d');try{let str=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});scanStream=str;vid.srcObject=str;vid.setAttribute('playsinline',!0);await vid.play();requestAnimationFrame(function scan(){if(!scanStream)return;if(vid.readyState===vid.HAVE_ENOUGH_DATA){can.width=vid.videoWidth;can.height=vid.videoHeight;ctx.drawImage(vid,0,0,can.width,can.height);let img=ctx.getImageData(0,0,can.width,can.height),code=jsQR(img.data,can.width,can.height,{inversionAttempts:"dontInvert"});if(code){processQR(code.data,pendScan);closeScanner();return;}}requestAnimationFrame(scan);});}catch(e){toast('Erro câmera','error');closeScanner();}}
    async function processQR(id,type){ld();try{let qr=await b.collection('qr_checkpoints').doc(id).get();if(!qr.exists)throw new Error('QR inválido');let d=qr.data();if(d.expiresAt&&d.expiresAt.toDate()<new Date())throw new Error('QR expirado');if(d.usedBy&&d.usedBy.includes(cu.uid))throw new Error('Você já usou este QR');if(type==='partner'&&d.type!=='partner')throw new Error('QR não é de parceiro');if(type==='mission'&&d.type!=='mission')throw new Error('QR não é de missão');if(type==='event'&&d.type!=='event')throw new Error('QR não é de evento');let uR=b.collection('users').doc(cu.uid);await b.runTransaction(async t=>{t.update(uR,{tokens:inc(d.tokensReward||0),xp:inc(d.xpReward)});t.update(b.collection('qr_checkpoints').doc(id),{usedBy:arrU(cu.uid),usedCount:inc(1)});});toast(`Checkpoint validado! +${d.xpReward} XP +${d.tokensReward||0} Tokens`,'success');let snap=await uR.get();cu.tokens=snap.data().tokens;cu.xp=snap.data().xp;updUI();}catch(e){toast(e.message,'error');}finally{hd();}}
    function closeScanner(){$('scannerModal').classList.add('hidden');if(scanStream){scanStream.getTracks().forEach(t=>t.stop());scanStream=null;}}
    function showView(v){document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));$(v).classList.add('active');document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));let nav=document.querySelector(`.nav-btn[data-view="${v}"]`);if(nav)nav.classList.add('active');if(v==='homeView')loadPartners();else if(v==='missoesView')loadMissoes();else if(v==='lojaView')loadLoja();else if(v==='inventarioView')loadInventario();else if(v==='rankingView')loadRanking();else if(v==='guildasView')loadGuildas();else if(v==='eventosView')loadEventos();else if(v==='sorteiosView')loadSorteios();else if(v==='atendimentoView'){loadServices();loadMyTickets();}else if(v==='adminView'){loadAdminMissions();loadAdminPartners();loadAdminRaffles();loadRaffleSelects();}}
    document.querySelectorAll('.nav-btn').forEach(btn=>btn.addEventListener('click',()=>showView(btn.dataset.view)));
    $('logoutBtn')?.addEventListener('click',()=>a.signOut());
    $('savePerfilBtn')?.addEventListener('click',async function(){if(!cu)return;let prof={nickname:san($('nicknameInput').value)||'Membro',bike:san($('bikeInput').value),city:san($('cityInput').value),instagram:san($('instagramInput').value),bio:san($('bioInput').value)};await b.collection('users').doc(cu.uid).update({profile:prof});cu.profile=prof;let cp=$('cpfInput').value;if(cp)await savePrivCPF(cp);updUI();toast('Perfil salvo!','success');});
    $('rewardBtn')?.addEventListener('click',()=>giveReward($('rewardEmail').value,parseInt($('rewardTokens').value)||0,parseInt($('rewardXp').value)||0));
    $('createItemBtn')?.addEventListener('click',()=>createItem($('itemName').value,parseInt($('itemPrice').value)||0));
    $('createMissionBtn')?.addEventListener('click',()=>createMission($('missionTitle').value,$('missionDesc').value,parseInt($('missionXp').value)||0,parseInt($('missionTokens').value)||0));
    $('createPartnerBtn')?.addEventListener('click',()=>createPartner($('partnerName').value,$('partnerDiscount').value,parseFloat($('partnerCashback').value)||0,$('partnerDesc').value));
    $('createRaffleBtn')?.addEventListener('click',()=>createRaffle($('raffleTitle').value,parseInt($('raffleCost').value)||0,$('raffleDesc').value));
    $('createTicketBtn')?.addEventListener('click',()=>createTicket($('ticketName').value,parseInt($('ticketPrice').value)||0,$('ticketRaffleSelect').value));
    $('createEventBtn')?.addEventListener('click',()=>createEvent($('eventTitle').value,$('eventDate').value,$('eventTime').value,$('eventSubject').value,parseInt($('eventXpReward').value)||0,parseInt($('eventTokensReward').value)||0));
    $('banUserBtn')?.addEventListener('click',()=>banUser($('targetEmail').value,!0));
    $('unbanUserBtn')?.addEventListener('click',()=>banUser($('targetEmail').value,!1));
    $('scanReceiptBtn')?.addEventListener('click',()=>toast('Nota fiscal em desenvolvimento','info'));
    $('scanPartnerCheckpointBtn')?.addEventListener('click',()=>startScanner('partner'));
    $('scanMissionCheckpointBtn')?.addEventListener('click',()=>startScanner('mission'));
    $('sendTicketBtn')?.addEventListener('click',async()=>{if(!cu)return toast('Login necessário','error');if(!checkCD('ticket',30))return;let sid=$('ticketServiceSelect').value,desc=$('ticketDescription').value;if(!sid||!desc)return toast('Preencha todos campos','error');ld();try{let srv=await b.collection('services').doc(sid).get();if(!srv.exists)throw new Error('Serviço inválido');let sv=srv.data();if(cu.tokens<sv.cost)throw new Error('Tokens insuficientes');await b.runTransaction(async t=>{let uR=b.collection('users').doc(cu.uid),uSnap=await t.get(uR);if(uSnap.data().tokens<sv.cost)throw new Error('Saldo');t.update(uR,{tokens:inc(-sv.cost),xp:inc(cfg.xpTicket)});t.set(b.collection('tickets').doc(),{userId:cu.uid,userEmail:cu.email,serviceId:sid,serviceName:sv.name,description:san(desc),status:'aberto',createdAt:ts()});});toast(`Ticket aberto! -${sv.cost} tokens +${cfg.xpTicket} XP`,'success');$('ticketModal').classList.add('hidden');loadMyTickets();let snap=await b.collection('users').doc(cu.uid).get();cu.tokens=snap.data().tokens;cu.xp=snap.data().xp;updUI();}catch(e){toast(e.message,'error');}finally{hd();}});
    $('openTicketBtn')?.addEventListener('click',()=>{if(cu)$('ticketModal').classList.remove('hidden');else toast('Faça login','error');});
    a.onAuthStateChanged(async u=>{if(u){ld();try{if(!u.emailVerified&&u.email!==MASTER){toast('⚠️ Verifique seu e-mail','error');await a.signOut();return;}await loadCfg();await ensureAdmin(u);let ud=await forceUserDoc(u);if(ud.status==='banido'){toast('Conta banida','error');await a.signOut();return;}cu={uid:u.uid,...ud};let cp=await loadPrivCPF();if($('cpfInput'))$('cpfInput').value=cp;$('authScreen').classList.add('hidden');$('app').classList.remove('hidden');updUI();listenU();loadPartners();showView('homeView');toast('🔥 Bem-vindo à Irmandade! 🔥','success');}catch(e){toast('Erro: '+e.message,'error');}finally{hd();}}else{if(usub)usub();cu=null;$('authScreen').classList.remove('hidden');$('app').classList.add('hidden');}});
    $('registerBtn')?.addEventListener('click',async function(){let em=$('emailLogin').value.trim(),pw=$('senhaLogin').value;if(!em||pw.length<6){toast('Email e senha (6+ caracteres)','error');return;}this.disabled=!0;let orig=this.innerText;this.innerText='Criando...';ld();try{let cred=await a.createUserWithEmailAndPassword(em,pw);await cred.user.sendEmailVerification();toast('Conta criada! Verifique seu e-mail.','info');}catch(e){toast('Erro: '+e.message,'error');}finally{this.disabled=!1;this.innerText=orig;hd();}});
    $('loginBtn')?.addEventListener('click',async function(){let em=$('emailLogin').value.trim(),pw=$('senhaLogin').value;if(!em||!pw){toast('Preencha email e senha','error');return;}this.disabled=!0;let orig=this.innerText;this.innerText='Entrando...';ld();try{await a.signInWithEmailAndPassword(em,pw);}catch(e){toast('Falha no login','error');}finally{this.disabled=!1;this.innerText=orig;hd();}});
    $('forgotPasswordBtn')?.addEventListener('click',async function(){let em=$('emailLogin').value.trim();if(!em){toast('Digite seu email','error');return;}this.disabled=!0;let orig=this.innerText;this.innerText='Enviando...';try{await a.sendPasswordResetEmail(em);toast('Email de recuperação enviado!','success');}catch(e){toast('Erro: '+e.message,'error');}finally{this.disabled=!1;this.innerText=orig;}});
    window.closeQRModal=()=>$('qrModal').classList.add('hidden');
    window.closeScannerModal=closeScanner;
    window.closeTicketModal=()=>$('ticketModal').classList.add('hidden');
    window.closeConfirmModal=()=>$('confirmModal').classList.add('hidden');
    window.closeGenerateQRModal=closeGenQR;
})();
</script>
