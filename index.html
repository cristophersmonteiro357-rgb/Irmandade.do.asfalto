<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Irmandade do Asfalto</title>

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

    <!-- QR Code libs -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

    <style>
        /* ==================== RESET & VARIÁVEIS ==================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        :root {
            --bg: #050302;
            --card: #120d09;
            --surface: #1d1510;
            --ember: #e06c2e;
            --emberLight: #ff9b57;
            --gold: #d4af37;
            --text: #f5ede0;
            --muted: #8b7765;
            --border: rgba(224, 108, 46, 0.25);
            --success: #2e7d32;
            --danger: #c55a3a;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
            font-family: Inter, system-ui, sans-serif;
        }

        body {
            background:
                radial-gradient(circle at top, rgba(224, 108, 46, 0.15), transparent 35%),
                var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* ==================== FUNDO RPG ==================== */
        .bg-flame {
            position: fixed;
            inset: 0;
            background:
                radial-gradient(circle at 20% 20%, rgba(255, 120, 40, 0.08), transparent 30%),
                radial-gradient(circle at 80% 70%, rgba(255, 80, 20, 0.06), transparent 30%);
            animation: flameMove 8s infinite alternate ease-in-out;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes flameMove {
            0% { transform: scale(1) translateY(0px); }
            100% { transform: scale(1.08) translateY(-10px); }
        }

        /* ==================== APP ==================== */
        #app {
            display: none;
            flex-direction: column;
            height: 100vh;
            position: relative;
            z-index: 2;
        }

        /* ==================== TOPO ==================== */
        .topbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px;
            background: rgba(5, 3, 2, 0.88);
            backdrop-filter: blur(18px);
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 30;
        }

        .logo-area {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            background: linear-gradient(135deg, #2d1a10, #140b07);
            border: 1px solid var(--border);
            box-shadow: 0 0 18px rgba(224, 108, 46, 0.25);
        }

        .logo-title {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.1rem;
            font-weight: 800;
        }

        .logo-title button {
            background: none;
            border: none;
            color: var(--emberLight);
            font-size: 1rem;
            cursor: pointer;
        }

        .logo-subtitle {
            font-size: 0.72rem;
            color: var(--muted);
            margin-top: 2px;
        }

        .token-box {
            padding: 10px 16px;
            border-radius: 18px;
            background: linear-gradient(135deg, rgba(224, 108, 46, 0.15), rgba(255, 140, 74, 0.08));
            border: 1px solid var(--border);
            font-weight: 700;
            color: var(--emberLight);
            box-shadow: 0 0 18px rgba(224, 108, 46, 0.15);
        }

        /* ==================== CONTEÚDO ==================== */
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
            padding-bottom: calc(90px + var(--safe-bottom));
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        /* ==================== CARD ==================== */
        .card {
            background: rgba(18, 13, 9, 0.88);
            border: 1px solid var(--border);
            border-radius: 28px;
            padding: 18px;
            backdrop-filter: blur(12px);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
        }

        /* ==================== HERO ==================== */
        .hero-card {
            position: relative;
            overflow: hidden;
        }

        .hero-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(224, 108, 46, 0.08), transparent 40%);
            pointer-events: none;
        }

        .hero-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .hero-label {
            font-size: 0.7rem;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 4px;
        }

        .patente {
            font-size: 1rem;
            font-weight: 700;
            color: var(--gold);
        }

        .level-circle {
            width: 72px;
            height: 72px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 900;
            background: radial-gradient(circle, rgba(255, 140, 74, 0.3), rgba(224, 108, 46, 0.08));
            border: 2px solid rgba(255, 140, 74, 0.4);
            box-shadow: 0 0 22px rgba(224, 108, 46, 0.25);
        }

        .hero-title {
            font-size: 1rem;
            letter-spacing: 1px;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .big-tokens {
            font-size: 4rem;
            font-weight: 900;
            color: var(--emberLight);
            text-shadow: 0 0 20px rgba(255, 120, 40, 0.35);
            margin-bottom: 18px;
        }

        /* ==================== XP ==================== */
        .xp-wrapper {
            margin-bottom: 18px;
        }

        .xp-bar {
            height: 12px;
            border-radius: 20px;
            overflow: hidden;
            background: #221812;
            margin-bottom: 8px;
        }

        .xp-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff7a2f, #ffb36d);
            border-radius: 20px;
            transition: 0.4s;
            box-shadow: 0 0 18px rgba(255, 140, 74, 0.3);
        }

        #xpText {
            font-size: 0.85rem;
            color: var(--muted);
        }

        /* ==================== GRID ==================== */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .stat-card {
            padding: 16px;
            border-radius: 22px;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.04);
            text-align: center;
            transition: 0.2s;
        }

        .stat-card:hover {
            transform: translateY(-2px);
        }

        .stat-icon {
            font-size: 1.4rem;
            margin-bottom: 8px;
        }

        .stat-label {
            font-size: 0.75rem;
            margin-top: 6px;
            color: var(--muted);
        }

        /* ==================== MENU ==================== */
        .grid-menu {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
        }

        .menu-card {
            border: none;
            border-radius: 24px;
            padding: 22px 14px;
            background: linear-gradient(135deg, rgba(255, 120, 40, 0.08), rgba(255, 255, 255, 0.02));
            border: 1px solid var(--border);
            color: var(--text);
            font-size: 1rem;
            font-weight: 700;
            display: flex;
            flex-direction: column;
            gap: 10px;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.25s;
            min-height: 120px;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 0 22px rgba(224, 108, 46, 0.18);
        }

        .menu-card div {
            font-size: 2rem;
        }

        /* ==================== PERFIL ==================== */
        .section-title {
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 14px;
            color: var(--emberLight);
        }

        .perfil-item {
            margin-bottom: 14px;
        }

        .perfil-item label {
            display: block;
            font-size: 0.82rem;
            margin-bottom: 6px;
            color: var(--muted);
        }

        .perfil-edit {
            display: flex;
            gap: 10px;
        }

        .perfil-edit button {
            width: 52px;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #b9591f, #e06c2e);
            color: #140a06;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
        }

        /* ==================== INPUTS ==================== */
        input,
        textarea {
            width: 100%;
            padding: 14px;
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            background: #1d1510;
            color: white;
            font-size: 0.95rem;
            outline: none;
            transition: 0.2s;
        }

        input:focus,
        textarea:focus {
            border-color: rgba(255, 140, 74, 0.4);
            box-shadow: 0 0 12px rgba(255, 140, 74, 0.12);
        }

        /* ==================== BOTÕES ==================== */
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 20px;
            font-size: 0.95rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.25s;
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: linear-gradient(135deg, #b9591f, #ff8c4a);
            color: #140a06;
            box-shadow: 0 0 18px rgba(224, 108, 46, 0.25);
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--emberLight);
        }

        /* ==================== LOGIN ==================== */
        #loginOverlay {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.92);
            z-index: 200;
            padding: 20px;
        }

        .login-card {
            width: 100%;
            max-width: 380px;
            padding: 28px;
            border-radius: 32px;
            background: rgba(18, 13, 9, 0.95);
            border: 1px solid var(--border);
            text-align: center;
            backdrop-filter: blur(18px);
            box-shadow: 0 0 40px rgba(224, 108, 46, 0.12);
        }

        .login-skull {
            font-size: 5rem;
            margin-bottom: 12px;
            filter: drop-shadow(0 0 12px rgba(255, 120, 40, 0.4));
        }

        .login-card h1 {
            font-size: 1.4rem;
            margin-bottom: 6px;
            color: var(--emberLight);
        }

        .login-card p {
            margin-bottom: 20px;
            color: var(--muted);
        }

        /* ==================== LOADING ==================== */
        .loading-full {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 16px;
            background: rgba(0, 0, 0, 0.92);
            z-index: 300;
        }

        .spinner {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--emberLight);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ==================== TOAST ==================== */
        .toast-stack {
            position: fixed;
            top: 14px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 90%;
            max-width: 360px;
            z-index: 999;
        }

        .toast {
            padding: 14px;
            border-radius: 18px;
            font-weight: 600;
            background: #221812;
            border-left: 4px solid var(--ember);
            animation: toastIn 0.25s ease;
        }

        .toast-success {
            border-left-color: var(--success);
        }

        .toast-error {
            border-left-color: var(--danger);
        }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ==================== RESPONSIVO ==================== */
        @media (max-width: 380px) {
            .big-tokens { font-size: 3rem; }
            .menu-card { min-height: 100px; }
        }
    </style>
</head>
<body>
    <!-- Fundo animado -->
    <div class="bg-flame"></div>

    <!-- Container de toasts -->
    <div id="toastStack" class="toast-stack"></div>

    <!-- ==================== LOGIN ==================== -->
    <div id="loginOverlay">
        <div class="login-card">
            <div class="login-skull">💀</div>
            <h1>IRMANDADE DO ASFALTO</h1>
            <p>Motoclube RPG</p>
            <input type="email" id="emailLogin" placeholder="Seu e-mail">
            <input type="password" id="senhaLogin" placeholder="Sua senha">
            <button id="loginBtn" class="btn btn-primary">⚡ ENTRAR</button>
            <button id="registerBtn" class="btn btn-outline">🛡️ CRIAR CONTA</button>
            <button id="forgotPasswordBtn" class="btn btn-outline">🔑 RECUPERAR SENHA</button>
        </div>
    </div>

    <!-- ==================== LOADING ==================== -->
    <div id="loadingData" class="loading-full" style="display:none;">
        <div class="spinner"></div>
        <span>Conectando à Irmandade...</span>
    </div>

    <!-- ==================== APP PRINCIPAL ==================== -->
    <div id="app">
        <!-- Topo -->
        <header class="topbar">
            <div class="logo-area">
                <div class="logo-icon">💀</div>
                <div>
                    <div class="logo-title">
                        <span id="nicknameDisplay">Asfalto</span>
                        <button id="editNicknameBtn">✏️</button>
                    </div>
                    <div class="logo-subtitle">Irmandade Oficial</div>
                </div>
            </div>
            <div class="token-box">🔥 <span id="creditsAmount">0</span></div>
        </header>

        <!-- Conteúdo -->
        <main class="content">
            <!-- Card principal -->
            <section class="card hero-card">
                <div class="hero-top">
                    <div>
                        <div class="hero-label">PATENTE</div>
                        <div id="patenteDisplay" class="patente">⚔️ Estradeiro</div>
                    </div>
                    <div class="level-circle"><span id="nivelDisplay">1</span></div>
                </div>
                <h2 class="hero-title">🔥 CHAMAS DA IRMANDADE</h2>
                <div class="big-tokens"><span id="bigCredits">0</span></div>
                <div class="xp-wrapper">
                    <div class="xp-bar"><div id="xpFill" class="xp-fill"></div></div>
                    <div id="xpText">0 XP</div>
                </div>
                <div class="stats-grid">
                    <div class="stat-card">
                        <div class="stat-icon">🎟️</div>
                        <div id="ticketAmount">0</div>
                        <div class="stat-label">Tickets</div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-icon">🏍️</div>
                        <div id="statusBadge">Adimplente</div>
                        <div class="stat-label">Status</div>
                    </div>
                </div>
            </section>

            <!-- Menu de ações -->
            <section class="grid-menu">
                <button class="menu-card"><div>📍</div><span>Check-in</span></button>
                <button class="menu-card"><div>⚔️</div><span>Missões</span></button>
                <button class="menu-card"><div>🎟️</div><span>Tickets</span></button>
                <button class="menu-card"><div>🤝</div><span>Parceiros</span></button>
                <button class="menu-card"><div>📷</div><span>Scanner</span></button>
                <button class="menu-card"><div>👤</div><span>Perfil</span></button>
            </section>

            <!-- Perfil -->
            <section class="card">
                <div class="section-title">👤 PERFIL</div>
                <div class="perfil-item">
                    <label>Apelido</label>
                    <div class="perfil-edit">
                        <input id="perfilApelido">
                        <button>✏️</button>
                    </div>
                </div>
                <div class="perfil-item">
                    <label>Moto</label>
                    <div class="perfil-edit">
                        <input id="perfilMoto">
                        <button>✏️</button>
                    </div>
                </div>
                <div class="perfil-item">
                    <label>Placa</label>
                    <div class="perfil-edit">
                        <input id="perfilPlaca">
                        <button>✏️</button>
                    </div>
                </div>
                <button id="savePerfilBtn" class="btn btn-primary">💾 SALVAR PERFIL</button>
            </section>

            <!-- Painel do Mestre (apenas admin) -->
            <section id="adminPanel" class="card" style="display:none;">
                <div class="section-title">👑 PAINEL DO MESTRE</div>
                <input id="adminUserEmail" placeholder="E-mail do membro">
                <input id="adminTokenAmount" type="number" placeholder="Tokens">
                <button id="mintTokensBtn" class="btn btn-primary">🔥 CUNHAR TOKENS</button>
                <hr>
                <input id="ticketNome" placeholder="Nome do Ticket">
                <input id="ticketPreco" type="number" placeholder="Preço">
                <button id="createTicketBtn" class="btn btn-primary">🎟️ CRIAR TICKET</button>
                <hr>
                <input id="eventoNome" placeholder="Nome do Evento">
                <input id="eventoLocal" placeholder="Local">
                <button id="createEventoBtn" class="btn btn-primary">🏍️ CRIAR EVENTO</button>
                <hr>
                <input id="parceiroNome" placeholder="Parceiro">
                <input id="parceiroDesconto" placeholder="Desconto">
                <button id="createPartnerBtn" class="btn btn-primary">🤝 ADICIONAR PARCEIRO</button>
            </section>

            <button onclick="logout()" class="btn btn-outline">🚪 SAIR</button>
        </main>
    </div>

    <!-- ==================== FIREBASE + APP JS ==================== -->
    <!-- Firebase SDKs (compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <script>
        // ======================= CONFIGURAÇÃO DO FIREBASE =======================
        const firebaseConfig = {
            apiKey: "AIzaSyDbb96DSw05nFxK8W6-khfbkRMn9CIheq8",
            authDomain: "clube-de-vantagens-d748e.firebaseapp.com",
            projectId: "clube-de-vantagens-d748e",
            storageBucket: "clube-de-vantagens-d748e.firebasestorage.app",
            messagingSenderId: "774730191238",
            appId: "1:774730191238:web:9af24eddfafb18f1351c07"
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        // Cache offline
        db.enablePersistence({ synchronizeTabs: true }).catch(err => {
            console.warn("Persistência offline indisponível:", err);
        });

        // Helpers
        const serverTimestamp = firebase.firestore.FieldValue.serverTimestamp;
        const increment = firebase.firestore.FieldValue.increment;
        const arrayUnion = firebase.firestore.FieldValue.arrayUnion;

        // ======================= CONSTANTES =======================
        const MASTER_EMAIL = "cristophersmonteiro357@gmail.com";
        let userData = null;

        // ======================= TOAST =======================
        function toast(msg, type = 'info') {
            const stack = document.getElementById('toastStack');
            const t = document.createElement('div');
            t.className = `toast ${type === 'error' ? 'toast-error' : type === 'success' ? 'toast-success' : ''}`;
            t.innerText = msg;
            stack.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // ======================= PATENTES =======================
        function calcularPatente(xp) {
            if (xp >= 5000) return '👑 Lenda do Asfalto';
            if (xp >= 2500) return '🔥 Senhor das Estradas';
            if (xp >= 1000) return '⚔️ Cavaleiro da Chama';
            if (xp >= 500) return '🛡️ Moto Guardião';
            if (xp >= 200) return '🏍️ Estradeiro Elite';
            return '⚔️ Estradeiro';
        }

        // ======================= ATUALIZAR UI =======================
        function atualizarUI() {
            if (!userData) return;

            const xp = userData.xp || 0;
            const nivel = Math.floor(xp / 100) + 1;
            const progress = xp % 100;

            document.getElementById('creditsAmount').innerText = userData.credits || 0;
            document.getElementById('bigCredits').innerText = userData.credits || 0;
            document.getElementById('ticketAmount').innerText = userData.tickets || 0;
            document.getElementById('nivelDisplay').innerText = nivel;
            document.getElementById('xpText').innerText = `${xp} XP`;
            document.getElementById('xpFill').style.width = `${progress}%`;
            document.getElementById('patenteDisplay').innerText = calcularPatente(xp);
            document.getElementById('nicknameDisplay').innerText = userData.perfil?.apelido || 'Asfalto';
            document.getElementById('perfilApelido').value = userData.perfil?.apelido || '';
            document.getElementById('perfilMoto').value = userData.perfil?.moto || '';
            document.getElementById('perfilPlaca').value = userData.perfil?.placa || '';
            document.getElementById('statusBadge').innerText = userData.status || 'Adimplente';

            if (userData.role === 'admin') {
                document.getElementById('adminPanel').style.display = 'block';
            }
        }

        // ======================= CRIAR CONTA =======================
        document.getElementById('registerBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailLogin').value.trim();
            const senha = document.getElementById('senhaLogin').value;

            if (!email || senha.length < 6) {
                toast('Senha mínima: 6 caracteres', 'error');
                return;
            }

            try {
                const cred = await auth.createUserWithEmailAndPassword(email, senha);
                const role = email === MASTER_EMAIL ? 'admin' : 'user';

                await db.collection('users').doc(cred.user.uid).set({
                    email,
                    role,
                    credits: 0,
                    xp: 0,
                    tickets: 0,
                    status: 'Adimplente',
                    perfil: { apelido: email.split('@')[0], moto: '', placa: '' },
                    createdAt: serverTimestamp(),
                    ticketsOwned: []
                });

                toast('Conta criada!', 'success');
            } catch (e) {
                toast(e.message, 'error');
            }
        });

        // ======================= LOGIN =======================
        document.getElementById('loginBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailLogin').value.trim();
            const senha = document.getElementById('senhaLogin').value;

            try {
                await auth.signInWithEmailAndPassword(email, senha);
            } catch (e) {
                toast('Falha no login', 'error');
            }
        });

        // ======================= RECUPERAR SENHA =======================
        document.getElementById('forgotPasswordBtn').addEventListener('click', async () => {
            const email = document.getElementById('emailLogin').value.trim();
            if (!email) {
                toast('Digite seu email', 'error');
                return;
            }
            try {
                await auth.sendPasswordResetEmail(email);
                toast('Email enviado', 'success');
            } catch (e) {
                toast(e.message, 'error');
            }
        });

        // ======================= AUTH STATE =======================
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                document.getElementById('loadingData').style.display = 'flex';
                try {
                    let snap = await db.collection('users').doc(user.uid).get();
                    if (!snap.exists) {
                        await db.collection('users').doc(user.uid).set({
                            email: user.email,
                            role: user.email === MASTER_EMAIL ? 'admin' : 'user',
                            credits: 0,
                            xp: 0,
                            tickets: 0,
                            status: 'Adimplente',
                            perfil: { apelido: user.email.split('@')[0], moto: '', placa: '' },
                            createdAt: serverTimestamp(),
                            ticketsOwned: []
                        });
                        snap = await db.collection('users').doc(user.uid).get();
                    }

                    userData = { uid: user.uid, ...snap.data() };
                    document.getElementById('loginOverlay').style.display = 'none';
                    document.getElementById('app').style.display = 'flex';
                    atualizarUI();
                    toast('Bem-vindo à Irmandade!', 'success');
                } catch (e) {
                    console.error(e);
                    toast('Erro ao carregar perfil', 'error');
                }
                document.getElementById('loadingData').style.display = 'none';
            } else {
                document.getElementById('loginOverlay').style.display = 'flex';
                document.getElementById('app').style.display = 'none';
            }
        });

        // ======================= SALVAR PERFIL =======================
        document.getElementById('savePerfilBtn').addEventListener('click', async () => {
            if (!userData) return;

            const perfil = {
                apelido: document.getElementById('perfilApelido').value,
                moto: document.getElementById('perfilMoto').value,
                placa: document.getElementById('perfilPlaca').value
            };

            try {
                await db.collection('users').doc(userData.uid).update({ perfil });
                userData.perfil = perfil;
                atualizarUI();
                toast('Perfil atualizado!', 'success');
            } catch (e) {
                toast('Erro ao salvar perfil', 'error');
            }
        });

        // ======================= CUNHAR TOKENS (ADMIN) =======================
        document.getElementById('mintTokensBtn').addEventListener('click', async () => {
            if (userData.role !== 'admin') return;

            const email = document.getElementById('adminUserEmail').value.trim();
            const amount = parseInt(document.getElementById('adminTokenAmount').value);
            if (!email || !amount) { toast('Dados inválidos', 'error'); return; }

            try {
                const q = await db.collection('users').where('email', '==', email).limit(1).get();
                if (q.empty) { toast('Usuário não encontrado', 'error'); return; }
                await q.docs[0].ref.update({ credits: increment(amount) });
                toast(`${amount} tokens enviados!`, 'success');
            } catch (e) {
                toast('Erro ao cunhar', 'error');
            }
        });

        // ======================= CRIAR TICKET (ADMIN) =======================
        document.getElementById('createTicketBtn').addEventListener('click', async () => {
            if (userData.role !== 'admin') return;
            const nome = document.getElementById('ticketNome').value;
            const preco = parseInt(document.getElementById('ticketPreco').value);
            if (!nome || !preco) { toast('Preencha os dados', 'error'); return; }

            try {
                await db.collection('tickets').add({ nome, preco, createdAt: serverTimestamp() });
                toast('Ticket criado!', 'success');
            } catch (e) {
                toast('Erro ao criar ticket', 'error');
            }
        });

        // ======================= CRIAR EVENTO (ADMIN) =======================
        document.getElementById('createEventoBtn').addEventListener('click', async () => {
            if (userData.role !== 'admin') return;
            const nome = document.getElementById('eventoNome').value;
            const local = document.getElementById('eventoLocal').value;
            if (!nome || !local) { toast('Preencha os dados', 'error'); return; }

            try {
                await db.collection('eventos').add({ nome, local, createdAt: serverTimestamp() });
                toast('Evento criado!', 'success');
            } catch (e) {
                toast('Erro ao criar evento', 'error');
            }
        });

        // ======================= ADICIONAR PARCEIRO (ADMIN) =======================
        document.getElementById('createPartnerBtn').addEventListener('click', async () => {
            if (userData.role !== 'admin') return;
            const nome = document.getElementById('parceiroNome').value;
            const desconto = document.getElementById('parceiroDesconto').value;
            if (!nome || !desconto) { toast('Preencha os dados', 'error'); return; }

            try {
                await db.collection('parceiros').add({ nome, desconto, createdAt: serverTimestamp() });
                toast('Parceiro criado!', 'success');
            } catch (e) {
                toast('Erro ao criar parceiro', 'error');
            }
        });

        // ======================= EDITAR NICKNAME =======================
        document.getElementById('editNicknameBtn').addEventListener('click', () => {
            document.getElementById('perfilApelido').focus();
        });

        // ======================= LOGOUT =======================
        window.logout = () => auth.signOut();

        // ======================= LIMPEZA DE SERVICE WORKERS =======================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
        }
    </script>
</body>
</html>
