<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Irmandade do Asfalto</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-firestore-compat.js"></script>

    <style>
        :root {
            --orange: #ff7b00;
            --orange-light: #ffae42;
            --card: #161616;
            --card2: #1f1f1f;
            --border: rgba(255, 123, 0, .2);
            --success: #2e7d32;
            --danger: #c55a3a;
            --gold: #ffd700;
            --text: #f5f5f5;
            --muted: #999;
            --safe-bottom: env(safe-area-inset-bottom, 16px);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', system-ui, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #0b0b0b;
            color: var(--text);
            height: 100vh;
            overflow: hidden;
        }

        button, input, textarea {
            border: none;
            outline: none;
            font-family: inherit;
        }

        button { cursor: pointer; }

        .hidden { display: none !important; }

        /* ============ LOADING ============ */
        .loading-overlay {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 16px;
            background: rgba(0, 0, 0, 0.9);
            z-index: 999;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-top-color: var(--orange);
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* ============ TOAST ============ */
        #toastContainer {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 1000;
            width: 90%;
            max-width: 400px;
        }

        .toast {
            padding: 14px 20px;
            border-radius: 16px;
            font-weight: 700;
            background: #1d1d1d;
            border-left: 4px solid var(--orange);
            animation: toastIn 0.25s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }

        .toast-success { border-left-color: var(--success); }
        .toast-error { border-left-color: var(--danger); }

        @keyframes toastIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ============ LOGIN ============ */
        #authScreen {
            position: fixed;
            inset: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            padding: 20px;
            z-index: 50;
        }

        .auth-card {
            width: 100%;
            max-width: 420px;
            background: #121212;
            padding: 32px;
            border-radius: 28px;
            display: flex;
            flex-direction: column;
            gap: 14px;
            border: 1px solid var(--border);
            box-shadow: 0 0 40px rgba(255, 123, 0, 0.1);
        }

        .auth-title {
            text-align: center;
            font-size: 28px;
            font-weight: 900;
            color: var(--orange);
        }

        .auth-card input {
            padding: 16px;
            background: #1d1d1d;
            border-radius: 16px;
            color: white;
            transition: box-shadow 0.2s;
        }

        .auth-card input:focus {
            box-shadow: 0 0 15px rgba(255, 123, 0, 0.3);
        }

        .btn {
            padding: 16px;
            border-radius: 16px;
            font-weight: 800;
            transition: transform 0.1s, opacity 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .btn:active { transform: scale(0.98); }
        .btn:disabled { opacity: 0.6; cursor: not-allowed; }

        .btn-primary {
            background: var(--orange);
            color: black;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid var(--orange);
            color: var(--orange);
        }

        /* ============ APP ============ */
        #app {
            display: flex;
            flex-direction: column;
            height: 100vh;
        }

        header {
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #101010;
            border-bottom: 1px solid var(--border);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            font-weight: 900;
            font-size: 22px;
            color: var(--orange);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo button {
            background: none;
            color: var(--orange-light);
            font-size: 16px;
            padding: 4px;
        }

        .token-box {
            background: #1b1b1b;
            padding: 12px 18px;
            border-radius: 14px;
            font-weight: 800;
            border: 1px solid rgba(255,255,255,0.08);
        }

        main {
            flex: 1;
            overflow-y: auto;
            padding: 18px;
            padding-bottom: calc(100px + var(--safe-bottom));
        }

        .card {
            background: var(--card);
            padding: 20px;
            border-radius: 24px;
            margin-bottom: 16px;
            border: 1px solid rgba(255,255,255,.05);
        }

        .section-title {
            font-size: 18px;
            font-weight: 800;
            margin-bottom: 16px;
            color: var(--orange);
        }

        .hero {
            padding: 24px;
            border-radius: 30px;
            background: linear-gradient(145deg, #1a1a1a, #0e0e0e);
            border: 1px solid var(--border);
            position: relative;
            overflow: hidden;
        }

        .hero h2 { font-size: 28px; margin-bottom: 6px; }

        .rank-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            margin-top: 8px;
        }

        .rank-bronze { background: rgba(205, 127, 50, 0.2); color: #cd7f32; }
        .rank-prata { background: rgba(192, 192, 192, 0.2); color: #c0c0c0; }
        .rank-ouro { background: rgba(255, 215, 0, 0.2); color: #ffd700; }
        .rank-platina { background: rgba(0, 217, 255, 0.2); color: #00d9ff; }
        .rank-diamante { background: rgba(125, 249, 255, 0.2); color: #7df9ff; }
        .rank-lendario { background: rgba(255, 61, 0, 0.2); color: #ff3d00; }

        .status-badge {
            display: inline-block;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 800;
            margin-top: 4px;
        }

        .status-ok { background: rgba(46, 125, 50, 0.2); color: #4caf50; }
        .status-bad { background: rgba(255, 61, 0, 0.2); color: #ff3d00; }

        .muted { color: var(--muted); }

        .xp-bar {
            height: 14px;
            background: #262626;
            border-radius: 20px;
            overflow: hidden;
            margin-top: 16px;
        }

        .xp-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #ff7b00, #ffb347);
            transition: width 0.4s ease;
            border-radius: 20px;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 20px;
        }

        .mini-card {
            background: var(--card2);
            padding: 16px;
            border-radius: 18px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .view { display: none; }
        .view.active { display: block; }

        input, textarea {
            width: 100%;
            padding: 16px;
            background: #1d1d1d;
            color: white;
            border-radius: 16px;
            margin-bottom: 12px;
            transition: box-shadow 0.2s;
        }

        input:focus, textarea:focus {
            box-shadow: 0 0 15px rgba(255, 123, 0, 0.2);
        }

        textarea { resize: vertical; min-height: 80px; }

        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-around;
            background: #121212;
            padding: 12px 16px calc(12px + var(--safe-bottom));
            border-top: 1px solid var(--border);
            z-index: 20;
        }

        .nav-btn {
            background: none;
            color: var(--muted);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            font-size: 18px;
            padding: 8px 16px;
            border-radius: 12px;
            transition: 0.2s;
        }

        .nav-btn.active {
            color: var(--orange);
            background: rgba(255, 123, 0, 0.1);
        }

        .partner-card {
            background: #1c1c1c;
            padding: 16px;
            border-radius: 18px;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.04);
        }

        .admin-only { display: none; }

        hr {
            border: none;
            height: 1px;
            background: #333;
            margin: 20px 0;
        }

        @media (max-width: 380px) {
            .hero h2 { font-size: 22px; }
            .auth-card { padding: 24px; }
        }
    </style>
</head>
<body>

    <!-- TOAST -->
    <div id="toastContainer"></div>

    <!-- LOADING -->
    <div id="loadingOverlay" class="loading-overlay hidden">
        <div class="spinner"></div>
        <span>Carregando...</span>
    </div>

    <!-- LOGIN -->
    <div id="authScreen">
        <div class="auth-card">
            <div class="auth-title">💀 IRMANDADE</div>
            <input id="emailLogin" type="email" placeholder="Seu email" autocomplete="email">
            <input id="senhaLogin" type="password" placeholder="Sua senha" autocomplete="current-password">
            <button class="btn btn-primary" id="loginBtn">⚡ ENTRAR</button>
            <button class="btn btn-outline" id="registerBtn">🛡️ CRIAR CONTA</button>
            <button class="btn btn-outline" id="forgotPasswordBtn" style="font-size:14px;">🔑 Recuperar senha</button>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="app" class="hidden">
        <header>
            <div class="logo">
                💀 IRMANDADE
            </div>
            <div class="token-box">🔥 <span id="tokensDisplay">0</span></div>
        </header>

        <main>
            <!-- HOME -->
            <div class="view active" id="homeView">
                <div class="hero">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <div>
                            <h2 id="nicknameDisplay">Membro</h2>
                            <div id="rankBadge" class="rank-badge rank-bronze">Bronze</div>
                            <div id="statusBadge" class="status-badge status-ok">Adimplente</div>
                        </div>
                        <button class="btn-outline" style="padding:8px 12px; font-size:14px;" onclick="showView('perfilView')">
                            ✏️ Editar
                        </button>
                    </div>
                    <div class="xp-bar"><div class="xp-fill" id="xpFill"></div></div>
                    <div style="margin-top:10px; display:flex; justify-content:space-between;">
                        <span id="xpText" class="muted">0 XP</span>
                        <span id="levelText" class="muted">Lv.1</span>
                    </div>
                    <div class="grid">
                        <div class="mini-card">
                            <div style="font-size:26px;">⚡</div>
                            <div id="xpAmount">0</div>
                            <div class="muted">XP Total</div>
                        </div>
                        <div class="mini-card">
                            <div style="font-size:26px;">🏍️</div>
                            <div id="cityText">-</div>
                            <div class="muted">Cidade</div>
                        </div>
                    </div>
                </div>

                <div class="card">
                    <div class="section-title">🤝 Parceiros</div>
                    <div id="partnersList"></div>
                </div>
            </div>

            <!-- PERFIL -->
            <div class="view" id="perfilView">
                <div class="card">
                    <div class="section-title">👤 Perfil</div>
                    <input id="nicknameInput" placeholder="Apelido">
                    <input id="bikeInput" placeholder="Moto">
                    <input id="cityInput" placeholder="Cidade">
                    <textarea id="bioInput" placeholder="Biografia"></textarea>
                    <button class="btn btn-primary" id="savePerfilBtn">💾 SALVAR PERFIL</button>
                </div>
            </div>

            <!-- ADMIN -->
            <div class="view" id="adminView">
                <div class="card">
                    <div class="section-title">👑 Painel Admin</div>

                    <input id="rewardEmail" placeholder="Email do usuário">
                    <div style="display:grid; grid-template-columns:1fr 1fr; gap:12px;">
                        <input id="rewardTokens" type="number" placeholder="Tokens" value="0">
                        <input id="rewardXp" type="number" placeholder="XP" value="0">
                    </div>
                    <button class="btn btn-primary" id="rewardBtn">🔥 ENVIAR RECOMPENSA</button>

                    <hr>

                    <input id="partnerName" placeholder="Nome do parceiro">
                    <input id="partnerDiscount" placeholder="Desconto (ex: 20% OFF)">
                    <button class="btn btn-primary" id="createPartnerBtn">🤝 CRIAR PARCEIRO</button>
                </div>
            </div>

            <button class="btn btn-outline" style="width:100%; margin-top:20px;" id="logoutBtn">
                🚪 SAIR
            </button>
        </main>

        <nav>
            <button class="nav-btn active" data-view="homeView">
                <i class="fas fa-home"></i><span style="font-size:10px;">Home</span>
            </button>
            <button class="nav-btn" data-view="perfilView">
                <i class="fas fa-user"></i><span style="font-size:10px;">Perfil</span>
            </button>
            <button class="nav-btn admin-only" data-view="adminView">
                <i class="fas fa-crown"></i><span style="font-size:10px;">Admin</span>
            </button>
        </nav>
    </div>

    <script>
        // ==================== CONFIGURAÇÃO FIREBASE ====================
        const firebaseConfig = {
            apiKey: "AIzaSyDbb96DSw05nFxK8W6-khfbkRMn9CIheq8",
            authDomain: "clube-de-vantagens-d748e.firebaseapp.com",
            projectId: "clube-de-vantagens-d748e",
            storageBucket: "clube-de-vantagens-d748e.firebasestorage.app",
            messagingSenderId: "774730191238",
            appId: "1:774730191238:web:9af24eddfafb18f1351c07"
        };

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();
        const db = firebase.firestore();

        // Cache offline
        db.enablePersistence({ synchronizeTabs: true }).catch(() => {});

        const increment = firebase.firestore.FieldValue.increment;
        const serverTimestamp = firebase.firestore.FieldValue.serverTimestamp;
        const arrayUnion = firebase.firestore.FieldValue.arrayUnion;

        const MASTER_EMAIL = "cristophersmonteiro357@gmail.com";

        let currentUser = null;
        let userListener = null; // Referência para unsubscribe

        // ==================== UTILITÁRIOS ====================
        function showLoading() {
            document.getElementById('loadingOverlay').classList.remove('hidden');
        }

        function hideLoading() {
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        function toast(msg, type = 'info') {
            const container = document.getElementById('toastContainer');
            const t = document.createElement('div');
            t.className = `toast ${type === 'success' ? 'toast-success' : type === 'error' ? 'toast-error' : ''}`;
            t.innerText = msg;
            container.appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        function disableButton(btn, text = 'Aguarde...') {
            btn.disabled = true;
            btn.dataset.originalText = btn.innerText;
            btn.innerText = text;
        }

        function enableButton(btn) {
            btn.disabled = false;
            if (btn.dataset.originalText) btn.innerText = btn.dataset.originalText;
            delete btn.dataset.originalText;
        }

        // ==================== SISTEMA RPG ====================
        function getLevel(xp) {
            return Math.floor((xp || 0) / 100) + 1;
        }

        function getRank(xp) {
            if (xp >= 3000) return { nome: 'Lendário', classe: 'rank-lendario' };
            if (xp >= 1500) return { nome: 'Diamante', classe: 'rank-diamante' };
            if (xp >= 700) return { nome: 'Platina', classe: 'rank-platina' };
            if (xp >= 300) return { nome: 'Ouro', classe: 'rank-ouro' };
            if (xp >= 100) return { nome: 'Prata', classe: 'rank-prata' };
            return { nome: 'Bronze', classe: 'rank-bronze' };
        }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            const view = document.getElementById(viewId);
            if (view) view.classList.add('active');

            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            const navBtn = document.querySelector(`.nav-btn[data-view="${viewId}"]`);
            if (navBtn) navBtn.classList.add('active');

            if (viewId === 'homeView') loadPartners();
        }

        // ==================== UI ====================
        function updateUI() {
            if (!currentUser) return;

            const xp = currentUser.xp || 0;
            const tokens = currentUser.tokens || 0;
            const rank = getRank(xp);
            const level = getLevel(xp);
            const status = currentUser.status || 'adimplente';

            // Header
            document.getElementById('tokensDisplay').innerText = tokens;

            // Home
            document.getElementById('nicknameDisplay').innerText = currentUser.profile?.nickname || 'Membro';
            document.getElementById('xpAmount').innerText = xp;
            document.getElementById('xpText').innerText = `${xp} XP`;
            document.getElementById('cityText').innerText = currentUser.profile?.city || '-';
            document.getElementById('levelText').innerText = `Lv.${level}`;
            document.getElementById('xpFill').style.width = `${(xp % 100)}%`;

            // Rank badge
            const rankEl = document.getElementById('rankBadge');
            rankEl.innerText = rank.nome;
            rankEl.className = `rank-badge ${rank.classe}`;

            // Status badge
            const statusEl = document.getElementById('statusBadge');
            statusEl.innerText = status === 'adimplente' ? 'Adimplente' : status.toUpperCase();
            statusEl.className = `status-badge ${status === 'adimplente' ? 'status-ok' : 'status-bad'}`;

            // Perfil form
            document.getElementById('nicknameInput').value = currentUser.profile?.nickname || '';
            document.getElementById('bikeInput').value = currentUser.profile?.bike || '';
            document.getElementById('cityInput').value = currentUser.profile?.city || '';
            document.getElementById('bioInput').value = currentUser.profile?.bio || '';

            // Admin
            const adminElements = document.querySelectorAll('.admin-only');
            if (currentUser.role === 'admin') {
                adminElements.forEach(el => el.style.display = 'flex');
            } else {
                adminElements.forEach(el => el.style.display = 'none');
            }
        }

        // ==================== LISTENER COM LIMPEZA ====================
        function listenUser() {
            // Remove listener anterior se existir
            if (userListener) userListener();

            userListener = db.collection('users')
                .doc(currentUser.uid)
                .onSnapshot((doc) => {
                    if (doc.exists) {
                        currentUser = { uid: doc.id, ...doc.data() };
                        updateUI();
                    }
                }, (error) => {
                    console.error('Erro no listener:', error);
                });
        }

        // ==================== AUTENTICAÇÃO ====================
        document.getElementById('registerBtn').addEventListener('click', async function() {
            const email = document.getElementById('emailLogin').value.trim();
            const senha = document.getElementById('senhaLogin').value;

            if (!email || senha.length < 6) {
                toast('Senha deve ter no mínimo 6 caracteres', 'error');
                return;
            }

            disableButton(this, 'Criando...');
            showLoading();

            try {
                const cred = await auth.createUserWithEmailAndPassword(email, senha);

                await db.collection('users').doc(cred.user.uid).set({
                    email,
                    role: email === MASTER_EMAIL ? 'admin' : 'user',
                    tokens: 0,
                    xp: 0,
                    status: 'adimplente',
                    profile: {
                        nickname: email.split('@')[0],
                        bike: '',
                        city: '',
                        bio: ''
                    },
                    createdAt: serverTimestamp(),
                    ticketsOwned: [],
                    inventory: []
                });

                toast('Conta criada com sucesso!', 'success');
            } catch (e) {
                console.error('Erro ao registrar:', e);
                if (e.code === 'auth/email-already-in-use') {
                    toast('Este email já está cadastrado', 'error');
                } else if (e.code === 'auth/weak-password') {
                    toast('Senha muito fraca', 'error');
                } else {
                    toast('Erro ao criar conta: ' + e.message, 'error');
                }
            } finally {
                enableButton(this);
                hideLoading();
            }
        });

        document.getElementById('loginBtn').addEventListener('click', async function() {
            const email = document.getElementById('emailLogin').value.trim();
            const senha = document.getElementById('senhaLogin').value;

            if (!email || !senha) {
                toast('Preencha email e senha', 'error');
                return;
            }

            disableButton(this, 'Entrando...');
            showLoading();

            try {
                await auth.signInWithEmailAndPassword(email, senha);
                // Auth state listener cuida do resto
            } catch (e) {
                console.error('Erro ao logar:', e);
                if (e.code === 'auth/user-not-found') {
                    toast('Usuário não encontrado', 'error');
                } else if (e.code === 'auth/wrong-password') {
                    toast('Senha incorreta', 'error');
                } else if (e.code === 'auth/invalid-email') {
                    toast('Email inválido', 'error');
                } else {
                    toast('Falha no login: ' + e.message, 'error');
                }
            } finally {
                enableButton(this);
                hideLoading();
            }
        });

        document.getElementById('forgotPasswordBtn').addEventListener('click', async function() {
            const email = document.getElementById('emailLogin').value.trim();
            if (!email) {
                toast('Digite seu email para recuperar a senha', 'error');
                return;
            }

            disableButton(this, 'Enviando...');
            try {
                await auth.sendPasswordResetEmail(email);
                toast('Email de recuperação enviado!', 'success');
            } catch (e) {
                console.error('Erro ao recuperar senha:', e);
                toast('Erro ao enviar email: ' + e.message, 'error');
            } finally {
                enableButton(this);
            }
        });

        // Auth state
        auth.onAuthStateChanged(async (user) => {
            if (user) {
                showLoading();
                try {
                    let snap = await db.collection('users').doc(user.uid).get();

                    if (!snap.exists) {
                        // Criar documento se não existir (fallback)
                        const defaultProfile = {
                            nickname: user.email.split('@')[0],
                            bike: '',
                            city: '',
                            bio: ''
                        };
                        await db.collection('users').doc(user.uid).set({
                            email: user.email,
                            role: user.email === MASTER_EMAIL ? 'admin' : 'user',
                            tokens: 0,
                            xp: 0,
                            status: 'adimplente',
                            profile: defaultProfile,
                            createdAt: serverTimestamp(),
                            ticketsOwned: [],
                            inventory: []
                        });
                        snap = await db.collection('users').doc(user.uid).get();
                    }

                    currentUser = { uid: user.uid, ...snap.data() };

                    document.getElementById('authScreen').classList.add('hidden');
                    document.getElementById('app').classList.remove('hidden');

                    updateUI();
                    listenUser();
                    loadPartners();
                    showView('homeView');

                    toast('Bem-vindo à Irmandade!', 'success');
                } catch (e) {
                    console.error('Erro ao carregar perfil:', e);
                    toast('Erro ao carregar dados do perfil', 'error');
                }
                hideLoading();
            } else {
                // Limpar listener ao deslogar
                if (userListener) {
                    userListener();
                    userListener = null;
                }
                currentUser = null;

                document.getElementById('authScreen').classList.remove('hidden');
                document.getElementById('app').classList.add('hidden');
            }
        });

        // ==================== PERFIL ====================
        document.getElementById('savePerfilBtn').addEventListener('click', async function() {
            if (!currentUser) return;

            const profile = {
                nickname: document.getElementById('nicknameInput').value.trim() || currentUser.profile?.nickname || 'Membro',
                bike: document.getElementById('bikeInput').value.trim(),
                city: document.getElementById('cityInput').value.trim(),
                bio: document.getElementById('bioInput').value.trim()
            };

            disableButton(this, 'Salvando...');
            try {
                await db.collection('users').doc(currentUser.uid).update({ profile });
                currentUser.profile = profile;
                updateUI();
                toast('Perfil salvo com sucesso!', 'success');
            } catch (e) {
                console.error('Erro ao salvar perfil:', e);
                toast('Erro ao salvar perfil: ' + e.message, 'error');
            } finally {
                enableButton(this);
            }
        });

        // ==================== PARCEIROS ====================
        async function loadPartners() {
            try {
                const snap = await db.collection('partners')
                    .orderBy('createdAt', 'desc')
                    .limit(20)
                    .get();

                let html = '';
                if (snap.empty) {
                    html = '<p class="muted" style="text-align:center;">Nenhum parceiro cadastrado ainda.</p>';
                } else {
                    snap.forEach(doc => {
                        const p = doc.data();
                        html += `
                            <div class="partner-card">
                                <h3>🤝 ${p.name || 'Parceiro'}</h3>
                                <p style="margin-top:6px; color:var(--orange);">🎁 ${p.discount || 'Desconto exclusivo'}</p>
                            </div>`;
                    });
                }

                document.getElementById('partnersList').innerHTML = html;
            } catch (e) {
                console.error('Erro ao carregar parceiros:', e);
                document.getElementById('partnersList').innerHTML = '<p class="muted">Erro ao carregar parceiros.</p>';
            }
        }

        // ==================== ADMIN ====================
        document.getElementById('rewardBtn').addEventListener('click', async function() {
            if (!currentUser || currentUser.role !== 'admin') {
                toast('Acesso negado', 'error');
                return;
            }

            const email = document.getElementById('rewardEmail').value.trim();
            const tokens = parseInt(document.getElementById('rewardTokens').value) || 0;
            const xp = parseInt(document.getElementById('rewardXp').value) || 0;

            if (!email) {
                toast('Informe o email do usuário', 'error');
                return;
            }

            if (tokens === 0 && xp === 0) {
                toast('Informe pelo menos tokens ou XP', 'error');
                return;
            }

            disableButton(this, 'Enviando...');
            try {
                const q = await db.collection('users')
                    .where('email', '==', email)
                    .limit(1)
                    .get();

                if (q.empty) {
                    toast('Usuário não encontrado', 'error');
                    enableButton(this);
                    return;
                }

                const updateData = {};
                if (tokens > 0) updateData.tokens = increment(tokens);
                if (xp > 0) updateData.xp = increment(xp);

                await q.docs[0].ref.update(updateData);

                toast(`Recompensa enviada para ${email}!`, 'success');

                // Limpar campos
                document.getElementById('rewardEmail').value = '';
                document.getElementById('rewardTokens').value = '0';
                document.getElementById('rewardXp').value = '0';
            } catch (e) {
                console.error('Erro ao enviar recompensa:', e);
                toast('Erro ao enviar recompensa: ' + e.message, 'error');
            } finally {
                enableButton(this);
            }
        });

        document.getElementById('createPartnerBtn').addEventListener('click', async function() {
            if (!currentUser || currentUser.role !== 'admin') {
                toast('Acesso negado', 'error');
                return;
            }

            const name = document.getElementById('partnerName').value.trim();
            const discount = document.getElementById('partnerDiscount').value.trim();

            if (!name || !discount) {
                toast('Preencha todos os campos do parceiro', 'error');
                return;
            }

            disableButton(this, 'Criando...');
            try {
                await db.collection('partners').add({
                    name,
                    discount,
                    createdBy: currentUser.uid,
                    createdAt: serverTimestamp()
                });

                toast('Parceiro criado com sucesso!', 'success');

                // Limpar campos
                document.getElementById('partnerName').value = '';
                document.getElementById('partnerDiscount').value = '';

                loadPartners();
            } catch (e) {
                console.error('Erro ao criar parceiro:', e);
                toast('Erro ao criar parceiro: ' + e.message, 'error');
            } finally {
                enableButton(this);
            }
        });

        // ==================== NAVEGAÇÃO ====================
        document.querySelectorAll('.nav-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                const viewId = btn.dataset.view;
                showView(viewId);
            });
        });

        // ==================== LOGOUT ====================
        document.getElementById('logoutBtn').addEventListener('click', () => {
            if (userListener) {
                userListener();
                userListener = null;
            }
            auth.signOut();
        });

        // ==================== LIMPEZA SERVICE WORKERS ====================
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(regs => regs.forEach(r => r.unregister()));
        }
    </script>
</body>
</html>
